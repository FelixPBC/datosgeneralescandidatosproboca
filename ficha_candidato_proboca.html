<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Información General - Candidatos Proboca</title>
  <style>
    :root {
      --primary: #d32f2f;
      --primary-dark: #b71c1c;
      --bg-gray: #f8f9fa;
      --border-color: #dcdcdc;
      --text-dark: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: var(--text-dark);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      background: white;
      width: 100%;
      max-width: 820px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* Header */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .logo-container img {
      max-height: 55px;
      width: auto;
    }

    .header-title {
      text-align: right;
    }

    .header-title h1 {
      font-size: 18px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-title p {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    /* Sections */
    .section-title {
      background-color: #fff2f2;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 12px;
      border-left: 4px solid var(--primary);
      margin-top: 15px;
      margin-bottom: 12px;
      border-radius: 0 4px 4px 0;
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      margin-bottom: 10px;
    }

    .col-12 { grid-column: span 12; }
    .col-8  { grid-column: span 8; }
    .col-6  { grid-column: span 6; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 600;
      color: #444;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .input-group input, .input-group select {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: #fafafa;
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.1);
    }

    .page-break {
      page-break-before: always;
      margin-top: 30px;
    }

    /* Print Button */
    .btn-container {
      text-align: center;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .btn-print {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(211, 47, 47, 0.3);
      transition: all 0.2s;
    }

    .btn-print:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* PRINT RULES FOR 2 PAGES FIT */
    @media print {
      @page {
        size: letter;
        margin: 12mm 15mm;
      }

      body {
        background-color: white;
        padding: 0;
      }

      .form-container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }

      .btn-container {
        display: none !important;
      }

      .input-group input, .input-group select {
        border: 1px solid #999;
        background-color: white;
        font-size: 12px;
        padding: 5px;
      }

      .page-break {
        page-break-before: always;
        margin-top: 0;
      }
    }

    @media (max-width: 600px) {
      .col-8, .col-6, .col-4, .col-3 {
        grid-column: span 12;
      }
      .header-bar {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      .header-title {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <!-- ENCABEZADO CON LOGO -->
    <div class="header-bar">
      <div class="logo-container">
        <!-- Logo Proboca -->
        <img src="https://proboca.com.mx/wp-content/uploads/2021/04/logo-proboca.png" alt="Proboca Logo" onerror="this.src='https://via.placeholder.com/150x50?text=PROBOCA';">
      </div>
      <div class="header-title">
        <h1>Ficha de Información General</h1>
        <p>Expediente de Personal Administrativo</p>
      </div>
    </div>

    <!-- PÁGINA 1 -->
    <!-- SECCIÓN 1: DATOS PERSONALES -->
    <div class="section-title">1. Datos Personales</div>
    <div class="grid-row">
      <div class="col-12 input-group">
        <label>Nombre Completo</label>
        <input type="text" placeholder="Nombre(s) y Apellidos">
      </div>
    </div>
    <div class="grid-row">
      <div class="col-4 input-group">
        <label>Fecha de Nacimiento</label>
        <input type="date">
      </div>
      <div class="col-4 input-group">
        <label>Edad</label>
        <input type="number" min="18" max="99" placeholder="Años">
      </div>
      <div class="col-4 input-group">
        <label>Estado Civil</label>
        <select>
          <option value="">Seleccionar...</option>
          <option>Soltero(a)</option>
          <option>Casado(a)</option>
          <option>Divorciado(a)</option>
          <option>Unión Libre</option>
          <option>Viudo(a)</option>
        </select>
      </div>
    </div>

    <!-- SECCIÓN 2: IDENTIFICACIÓN Y REGISTRO FISCAL -->
    <div class="section-title">2. Identificación Oficial y Registro Fiscal</div>
    <div class="grid-row">
      <div class="col-6 input-group">
        <label>CURP</label>
        <input type="text" maxlength="18" placeholder="18 caracteres" style="text-transform:uppercase;">
      </div>
      <div class="col-6 input-group">
        <label>RFC (con homoclave)</label>
        <input type="text" maxlength="13" placeholder="13 caracteres" style="text-transform:uppercase;">
      </div>
    </div>
    <div class="grid-row">
      <div class="col-6 input-group">
        <label>Código Postal (Domicilio Fiscal)</label>
        <input type="text" maxlength="5" placeholder="C.P. de CSF SAT">
      </div>
      <div class="col-6 input-group">
        <label>Número de Seguro Social (NSS)</label>
        <input type="text" maxlength="11" placeholder="11 dígitos">
      </div>
    </div>

    <!-- SECCIÓN 3: INFORMACIÓN BANCARIA -->
    <div class="section-title">3. Información Bancaria</div>
    <div class="grid-row">
      <div class="col-4 input-group">
        <label>¿Cuenta activa en Santander?</label>
        <select>
          <option value="">Seleccionar...</option>
          <option>Sí</option>
          <option>No</option>
        </select>
      </div>
      <div class="col-8 input-group">
        <label>Número de Cuenta / CLABE Santander (18 dígitos)</label>
        <input type="text" maxlength="18" placeholder="Si respondió Sí, ingrese su CLABE o Número de cuenta">
      </div>
    </div>

    <!-- PÁGINA 2 (SALTO DE PÁGINA PARA IMPRESIÓN) -->
    <div class="page-break"></div>

    <!-- SECCIÓN 4: CRÉDITOS Y FINANCIAMIENTOS -->
    <div class="section-title">4. Créditos y Financiamientos</div>
    <div class="grid-row">
      <div class="col-6 input-group">
        <label>¿Cuenta con Crédito INFONAVIT?</label>
        <select>
          <option value="">Seleccionar...</option>
          <option>Sí</option>
          <option>No</option>
        </select>
      </div>
      <div class="col-6 input-group">
        <label>Descuento Mensual INFONAVIT ($)</label>
        <input type="text" placeholder="$ 0.00 (Si aplica)">
      </div>
    </div>
    <div class="grid-row">
      <div class="col-6 input-group">
        <label>¿Cuenta con Crédito FONACOT?</label>
        <select>
          <option value="">Seleccionar...</option>
          <option>Sí</option>
          <option>No</option>
        </select>
      </div>
      <div class="col-6 input-group">
        <label>Descuento Mensual FONACOT ($)</label>
        <input type="text" placeholder="$ 0.00 (Si aplica)">
      </div>
    </div>

    <!-- SECCIÓN 5: CONTACTO DIRECTO -->
    <div class="section-title">5. Contacto Directo</div>
    <div class="grid-row">
      <div class="col-6 input-group">
        <label>Teléfono Móvil / WhatsApp</label>
        <input type="tel" placeholder="10 dígitos">
      </div>
      <div class="col-6 input-group">
        <label>Correo Electrónico</label>
        <input type="email" placeholder="ejemplo@correo.com">
      </div>
    </div>
    <div class="grid-row">
      <div class="col-12 input-group">
        <label>Domicilio Particular Completo</label>
        <input type="text" placeholder="Calle, número ext/int, colonia, municipio y estado">
      </div>
    </div>

    <!-- BOTÓN DE GUARDAR EN PDF -->
    <div class="btn-container">
      <button class="btn-print" onclick="window.print()">Imprimir o Guardar como PDF</button>
    </div>

  </div>

</body>
</html>
